<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEEE 754 Quiz</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1b26;
  color: #c0caf5;
  font-family: 'Courier New', Courier, monospace;
  font-size: 15px;
  line-height: 1.6;
  padding: 28px 20px;
  min-height: 100vh;
}

#app { max-width: 720px; margin: 0 auto; }

/* ── Menu ── */
.menu h1 {
  color: #7dcfff;
  font-size: 1.2em;
  margin-bottom: 20px;
  letter-spacing: 0.04em;
}
.menu-row { margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
.menu-row label { color: #a9b1d6; min-width: 100px; }
select {
  background: #24283b;
  color: #c0caf5;
  border: 1px solid #414868;
  padding: 4px 8px;
  font-family: inherit;
  font-size: inherit;
  border-radius: 3px;
  cursor: pointer;
  outline: none;
}
select:focus { border-color: #7dcfff; }
.menu-hint { color: #565f89; font-size: 0.85em; margin: 16px 0 20px; }
.btn {
  background: transparent;
  color: #7dcfff;
  border: 1px solid #7dcfff;
  padding: 6px 18px;
  font-family: inherit;
  font-size: inherit;
  border-radius: 3px;
  cursor: pointer;
}
.btn:hover { background: #7dcfff; color: #1a1b26; }

/* ── Quiz shell ── */
.q-header { color: #a9b1d6; margin-bottom: 6px; }
.q-header .hl-bits  { color: #7dcfff; font-weight: bold; }
.q-header .hl-diff  { color: #e0af68; }
.q-header .hl-mode  { color: #565f89; }
.q-header .hl-score { color: #9ece6a; }
.q-header .hl-dim   { color: #565f89; }
.divider { border: none; border-top: 1px solid #414868; margin: 6px 0 14px; }

/* ── Feedback ── */
.fb { padding: 10px 12px; border-left: 3px solid; margin-bottom: 14px; }
.fb-ok   { border-color: #9ece6a; }
.fb-skip { border-color: #e0af68; }
.fb-wrong { border-color: #f7768e; }

.lbl-ok   { color: #9ece6a; font-weight: bold; }
.lbl-skip { color: #e0af68; font-weight: bold; }
.lbl-wrong { color: #f7768e; font-weight: bold; }

.fb-row { margin-top: 3px; }
.fb-label { color: #565f89; display: inline-block; min-width: 80px; }
.fb-correct { color: #9ece6a; }
.fb-yours { color: #565f89; }
.fb-dim { color: #565f89; font-size: 0.9em; }

/* Coloured bit segments */
.b-sign { color: #f7768e; }
.b-exp  { color: #e0af68; }
.b-mant { color: #9ece6a; }
.b-sep  { color: #414868; }

/* ── Question ── */
.q-convert { color: #a9b1d6; margin-bottom: 6px; }
.q-number  { font-size: 1.6em; font-weight: bold; color: #cdd6f4; margin: 6px 0 12px; }
.q-format  { color: #565f89; font-size: 0.88em; margin-bottom: 2px; }
.q-hint    { color: #565f89; font-size: 0.88em; margin-bottom: 14px; }

/* ── Input row ── */
.input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.input-prompt { color: #c0caf5; font-weight: bold; font-size: 1.15em; }
#q-input {
  background: #24283b;
  color: #c0caf5;
  border: 1px solid #414868;
  padding: 6px 10px;
  font-family: inherit;
  font-size: inherit;
  flex: 1;
  border-radius: 3px;
  outline: none;
  letter-spacing: 0.05em;
}
#q-input:focus { border-color: #7dcfff; }

.q-error { color: #f7768e; min-height: 1.4em; font-size: 0.9em; margin-bottom: 4px; }
.q-commands { color: #414868; font-size: 0.82em; margin-top: 10px; }

/* ── Final screen ── */
.final { text-align: center; padding: 60px 0; }
.final-title { color: #7dcfff; font-size: 1.1em; margin-bottom: 16px; }
.final-score { font-size: 2.4em; font-weight: bold; color: #9ece6a; }
.final-sub   { color: #565f89; margin: 6px 0 24px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

// ── Core (identical to ieee754quiz.js) ───────────────────────────────────────

const FORMATS = {
  8:  { expBits: 4,  mantBits: 3,  bias: 7    },
  16: { expBits: 5,  mantBits: 10, bias: 15   },
  32: { expBits: 8,  mantBits: 23, bias: 127  },
  64: { expBits: 11, mantBits: 52, bias: 1023 },
};

function toBits(value, bits) {
  if (bits === 32 || bits === 64) {
    const buf  = new ArrayBuffer(bits / 8);
    const view = new DataView(buf);
    if (bits === 32) view.setFloat32(0, value, false);
    else             view.setFloat64(0, value, false);
    let s = '';
    for (let i = 0; i < bits / 8; i++) s += view.getUint8(i).toString(2).padStart(8, '0');
    return s;
  }
  return smallFloat(value, FORMATS[bits]);
}

function smallFloat(value, { expBits, mantBits, bias }) {
  const maxBE = (1 << expBits) - 1;
  if (Object.is(value,  0))  return '0' + '0'.repeat(expBits + mantBits);
  if (Object.is(value, -0))  return '1' + '0'.repeat(expBits + mantBits);
  if (Number.isNaN(value))   return '0' + '1'.repeat(expBits) + '1' + '0'.repeat(mantBits - 1);
  const sign = value < 0 ? '1' : '0';
  const abs  = Math.abs(value);
  if (!isFinite(abs)) return sign + '1'.repeat(expBits) + '0'.repeat(mantBits);
  const e = Math.floor(Math.log2(abs));
  let bE  = e + bias;
  if (bE >= maxBE) return sign + '1'.repeat(expBits) + '0'.repeat(mantBits);
  if (bE <= 0) {
    const mant = Math.round(abs * Math.pow(2, bias - 1 + mantBits));
    return sign + '0'.repeat(expBits) + mant.toString(2).padStart(mantBits, '0').slice(-mantBits);
  }
  let mant = Math.round((abs / Math.pow(2, e) - 1) * Math.pow(2, mantBits));
  if (mant >= (1 << mantBits)) {
    mant = 0; bE++;
    if (bE >= maxBE) return sign + '1'.repeat(expBits) + '0'.repeat(mantBits);
  }
  return sign + bE.toString(2).padStart(expBits, '0') + mant.toString(2).padStart(mantBits, '0');
}

const POOLS = {
  easy: {
    8:  [0, 1, -1, 2, -2, 4, -4, 0.5, -0.5, 0.25, -0.25, 1.5, -1.5],
    16: [0, 1, -1, 2, -2, 4, -4, 8, -8, 0.5, -0.5, 0.25, -0.25, 1.5, -1.5],
    32: [0, 1, -1, 2, -2, 4, -4, 8, -8, 16, -16, 0.5, -0.5, 0.25, -0.25, 1.5, -1.5],
    64: [0, 1, -1, 2, -2, 4, -4, 8, -8, 16, -16, 0.5, -0.5, 0.25, -0.25, 1.5, -1.5],
  },
  medium: {
    8:  [3, -3, 6, -6, 7, -7, 0.75, -0.75, 1.25, -1.25, 0.375, -0.375, 1.875, -1.875, 3.5, -3.5],
    16: [3, -3, 6, -6, 100, -100, 0.75, -0.75, 1.25, -1.25, 0.375, -0.375, 0.0625, -0.0625, 1024, -1024],
    32: [3, -3, 100, -100, 1000, -1000, 0.75, -0.75, 0.125, -0.125, 255, -255, 0.0625, -0.0625],
    64: [3, -3, 100, -100, 1000, -1000, 0.75, -0.75, 0.125, -0.125, 255, -255, 0.0625, -0.0625],
  },
  hard: {
    8:  [11, -11, 13, -13, 14, -14, 7.5, -7.5, 0.4375, -0.4375, 0.001953125, 1.875, -1.875],
    16: [3.140625, -3.140625, 100.5, -100.5, 0.001953125, -0.001953125, 65504, -65504, 6.103515625e-5],
    32: [Math.PI, -Math.PI, 1/3, 255.5, 1e10, -1e10, Infinity, -Infinity, 1.17549435e-38],
    64: [Math.PI, -Math.PI, Math.E, -Math.E, 1/7, 1e100, -1e100, 1e-100, Number.MAX_SAFE_INTEGER],
  },
};

function randPick(pool) { return pool[Math.floor(Math.random() * pool.length)]; }

function segmented(bits, bin) {
  const { expBits } = FORMATS[bits];
  return `${bin[0]} | ${bin.slice(1, 1 + expBits)} | ${bin.slice(1 + expBits)}`;
}

function numLabel(n) {
  if (Number.isNaN(n)) return 'NaN';
  if (n === Infinity)  return 'Infinity';
  if (n === -Infinity) return '-Infinity';
  return String(n);
}

function hexToBin(hex, bits) {
  if (bits <= 32) return parseInt(hex, 16).toString(2).padStart(bits, '0');
  const hi = parseInt(hex.slice(0, 8), 16);
  const lo = parseInt(hex.slice(8), 16);
  return hi.toString(2).padStart(32, '0') + lo.toString(2).padStart(32, '0');
}

function binToHex(bin, bits) {
  if (bits <= 32) return parseInt(bin, 2).toString(16).padStart(bits / 4, '0').toUpperCase();
  const hi = parseInt(bin.slice(0, 32), 2);
  const lo = parseInt(bin.slice(32), 2);
  return (hi.toString(16).padStart(8, '0') + lo.toString(16).padStart(8, '0')).toUpperCase();
}

// ── Quiz engine (identical to ieee754quiz.js) ─────────────────────────────────

class Quiz {
  constructor(renderer) {
    this.renderer  = renderer;
    this.bits      = 32;
    this.diff      = 'easy';
    this.inputMode = 'binary';
    this.score     = 0;
    this.asked     = 0;
    this.last      = null;
  }

  async start() {
    const cfg      = await this.renderer.showMenu();
    this.bits      = cfg.bits;
    this.diff      = cfg.diff;
    this.inputMode = cfg.inputMode;
    this.score     = 0;
    this.asked     = 0;
    this.last      = null;
    await this.run();
  }

  async run() {
    while (true) {
      const num    = randPick(POOLS[this.diff][this.bits]);
      const answer = toBits(num, this.bits);
      const F      = FORMATS[this.bits];
      const maxBE  = (1 << F.expBits) - 1;
      const hexLen = this.bits / 4;

      this.renderer.renderQuestion({
        bits: this.bits, diff: this.diff, inputMode: this.inputMode,
        score: this.score, asked: this.asked, last: this.last,
        num, answer, F, maxBE, hexLen,
      });

      while (true) {
        const raw = await this.renderer.getInput();
        const inp = raw.trim().replace(/[\s|]+/g, '').toLowerCase();

        if (inp === 'q' || inp === 'quit') { this.renderer.quit(this.score, this.asked); return; }
        if (inp === 'menu') { await this.start(); return; }
        if (inp === 'skip') { this.last = { type: 'skip', num, answer }; break; }

        let userBin;
        if (this.inputMode === 'hex') {
          const h = inp.replace(/^0x/, '');
          if (!/^[0-9a-f]+$/.test(h) || h.length !== hexLen) {
            this.renderer.showError(`Need exactly ${hexLen} hex digits (0x prefix optional).`);
            continue;
          }
          userBin = hexToBin(h, this.bits);
        } else {
          if (!/^[01]+$/.test(inp) || inp.length !== this.bits) {
            this.renderer.showError(`Need exactly ${this.bits} binary digits (spaces and '|' are stripped).`);
            continue;
          }
          userBin = inp;
        }

        this.asked++;
        if (userBin === answer) {
          this.score++;
          this.last = { type: 'ok', num, answer };
        } else {
          this.last = { type: 'wrong', num, answer, yours: userBin };
        }
        break;
      }
    }
  }
}

// ── Web renderer ──────────────────────────────────────────────────────────────

// Returns coloured HTML for a binary string, split by field.
function coloredBits(bits, bin) {
  const { expBits } = FORMATS[bits];
  const s = `<span class="b-sign">${bin[0]}</span>`;
  const e = `<span class="b-exp">${bin.slice(1, 1 + expBits)}</span>`;
  const m = `<span class="b-mant">${bin.slice(1 + expBits)}</span>`;
  return `${s}<span class="b-sep"> | </span>${e}<span class="b-sep"> | </span>${m}`;
}

function breakdownText(answer, F, maxBE) {
  const expStr  = answer.slice(1, 1 + F.expBits);
  const mantStr = answer.slice(1 + F.expBits);
  const bE      = parseInt(expStr, 2);
  const aE      = bE === 0 ? 1 - F.bias : bE - F.bias;
  const kind    = bE === 0 ? 'denormal/zero' : bE === maxBE ? 'inf/NaN' : 'normal';
  return { expStr, mantStr, bE, aE, kind };
}

class WebRenderer {
  constructor() {
    this._resolve     = null;  // resolves when user presses Enter
    this._shellReady  = false;
  }

  // ── Menu ──────────────────────────────────────────────────────────────────

  showMenu() {
    this._shellReady = false;
    document.getElementById('app').innerHTML = `
      <div class="menu">
        <h1>IEEE 754 Float &rarr; Binary Quiz</h1>
        <form id="menu-form">
          <div class="menu-row">
            <label>Bit width</label>
            <select name="bits">
              <option value="8">8-bit (minifloat, 1s4e3m)</option>
              <option value="16">16-bit (half precision)</option>
              <option value="32" selected>32-bit (single precision)</option>
              <option value="64">64-bit (double precision)</option>
            </select>
          </div>
          <div class="menu-row">
            <label>Difficulty</label>
            <select name="diff">
              <option value="easy" selected>Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="menu-row">
            <label>Input mode</label>
            <select name="inputMode">
              <option value="binary" selected>Binary</option>
              <option value="hex">Hex</option>
            </select>
          </div>
          <div class="menu-hint">During the quiz: type <b>skip</b> to reveal the answer, <b>menu</b> to return here, <b>q</b> to quit.</div>
          <button class="btn" type="submit">Start Quiz</button>
        </form>
      </div>`;

    return new Promise(resolve => {
      document.getElementById('menu-form').addEventListener('submit', e => {
        e.preventDefault();
        const f = e.target;
        resolve({
          bits:      parseInt(f.bits.value),
          diff:      f.diff.value,
          inputMode: f.inputMode.value,
        });
      }, { once: true });
    });
  }

  // ── Quiz shell (created once per session, updated per question) ───────────

  _initShell() {
    if (this._shellReady) return;
    this._shellReady = true;
    document.getElementById('app').innerHTML = `
      <div class="q-header" id="q-header"></div>
      <hr class="divider">
      <div id="q-feedback"></div>
      <div id="q-question"></div>
      <div class="input-row">
        <span class="input-prompt">&#8250;</span>
        <input id="q-input" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" autofocus>
      </div>
      <div class="q-error" id="q-error"></div>
      <div class="q-commands">skip &middot; menu &middot; q</div>`;

    document.getElementById('q-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && this._resolve) {
        const val = e.target.value;
        e.target.value = '';
        const res = this._resolve;
        this._resolve = null;
        res(val);
      }
    });
  }

  // ── renderQuestion ────────────────────────────────────────────────────────

  renderQuestion({ bits, diff, inputMode, score, asked, last, num, F, maxBE, hexLen }) {
    this._initShell();

    // Header
    document.getElementById('q-header').innerHTML =
      `IEEE754 &nbsp; <span class="hl-bits">${bits}-bit</span>` +
      ` &nbsp; <span class="hl-diff">${diff}</span>` +
      ` &nbsp; <span class="hl-mode">[${inputMode}]</span>` +
      ` &nbsp;&nbsp; score <span class="hl-score">${score}</span><span class="hl-dim">/${asked}</span>`;

    // Feedback from previous question
    let fbHTML = '';
    if (last) {
      const L = last;
      if (L.type === 'ok') {
        const disp = inputMode === 'hex'
          ? `<span class="fb-correct">${binToHex(L.answer, bits)}</span>`
          : coloredBits(bits, L.answer);
        fbHTML = `<div class="fb fb-ok">
          <span class="lbl-ok">&#10003; Correct!</span>
          &nbsp; <span class="fb-dim">${numLabel(L.num)} &rarr; ${disp}</span>
        </div>`;
      } else {
        const { expStr, mantStr, bE, aE, kind } = breakdownText(L.answer, F, maxBE);
        const breakdown =
          `<div class="fb-row fb-dim">sign=<span class="b-sign">${L.answer[0]}</span>` +
          `  exp=<span class="b-exp">${expStr}</span>(=${bE})&rarr;actual ${aE}` +
          `  mant=<span class="b-mant">${mantStr}</span>  [${kind}]</div>`;

        if (L.type === 'skip') {
          const ansDisp = inputMode === 'hex'
            ? `<span class="fb-correct">${binToHex(L.answer, bits)}</span>`
            : coloredBits(bits, L.answer);
          fbHTML = `<div class="fb fb-skip">
            <span class="lbl-skip">&#8631; Skipped</span> &nbsp; <b>${numLabel(L.num)}</b>
            <div class="fb-row"><span class="fb-label">answer:</span> ${ansDisp}</div>
            ${inputMode === 'hex'
              ? `<div class="fb-row"><span class="fb-label">binary:</span> ${coloredBits(bits, L.answer)}</div>`
              : ''}
            ${breakdown}
          </div>`;
        } else {
          const correctDisp = inputMode === 'hex'
            ? `<span class="fb-correct">${binToHex(L.answer, bits)}</span>`
            : coloredBits(bits, L.answer);
          const yoursDisp = inputMode === 'hex'
            ? `<span class="fb-yours">${binToHex(L.yours, bits)}</span>`
            : `<span class="fb-yours">${segmented(bits, L.yours)}</span>`;
          fbHTML = `<div class="fb fb-wrong">
            <span class="lbl-wrong">&#10007; Wrong!</span> &nbsp; <b>${numLabel(L.num)}</b>
            <div class="fb-row"><span class="fb-label">yours:</span> ${yoursDisp}</div>
            <div class="fb-row"><span class="fb-label">correct:</span> ${correctDisp}</div>
            ${inputMode === 'hex'
              ? `<div class="fb-row"><span class="fb-label">binary:</span> ${coloredBits(bits, L.answer)}</div>`
              : ''}
            ${breakdown}
          </div>`;
        }
      }
    }
    document.getElementById('q-feedback').innerHTML = fbHTML;

    // Question
    const hintMode = inputMode === 'hex'
      ? `Enter ${hexLen} hex digits (0x optional)`
      : `Enter ${bits} bits (spaces / '|' ignored)`;
    document.getElementById('q-question').innerHTML =
      `<div class="q-convert">Convert to ${bits}-bit IEEE754:</div>
       <div class="q-number">${numLabel(num)}</div>
       <div class="q-format">Format: 1 sign | ${F.expBits} exponent bits (bias ${F.bias}) | ${F.mantBits} mantissa bits</div>
       <div class="q-hint">${hintMode} — or type <b>skip</b> to reveal</div>`;

    // Clear error and focus
    document.getElementById('q-error').textContent = '';
    document.getElementById('q-input').focus();
  }

  // ── Input / error ─────────────────────────────────────────────────────────

  getInput() {
    document.getElementById('q-error').textContent = '';
    return new Promise(resolve => { this._resolve = resolve; });
  }

  showError(msg) {
    document.getElementById('q-error').textContent = msg;
    document.getElementById('q-input').focus();
  }

  // ── Quit ──────────────────────────────────────────────────────────────────

  quit(score, asked) {
    this._shellReady = false;
    document.getElementById('app').innerHTML = `
      <div class="final">
        <div class="final-title">IEEE 754 Quiz — Game Over</div>
        <div class="final-score">${score} / ${asked}</div>
        <div class="final-sub">questions answered correctly</div>
        <button class="btn" onclick="new Quiz(new WebRenderer()).start()">Play Again</button>
      </div>`;
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  new Quiz(new WebRenderer()).start();
});
</script>
</body>
</html>
