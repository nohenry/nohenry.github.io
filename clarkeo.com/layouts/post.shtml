<extend template="base.shtml">
<head id="head">
	<style>
		#prev-next {
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			margin-top: 10px;
		}
		
		figure {
			align-self: center;
			text-align: center;
			font-style: italic;
		}

        .surround {
            border: solid #11111118 1px;
            padding: 1rem;
        }

        figure img {
            max-width: 100%;
        }
		
		.post {
			display:flex;
			flex-direction: column;
		}

        details p {
            margin-left: 2rem;
        }

        #date-home {
            display: flex;
			justify-content: space-between;
            align-items: center;
        }

        #date-home p {
            padding: 0;
            margin: 0;
        }

        .images_horizontal {
            display: flex;
            flex-direction: row;
            gap: 1rem;
        }

        .images_horizontal p {
            display: none;
        }

        .images_horizontal figure {
            margin: 0;
        }

        @media only screen and (max-width: 768px) {
            .images_horizontal {
                flex-direction: column;
            }
        }

        .inline-small {
            color: gray;
            font-style: italic;
        }
	</style>
</head>
<body id="body">
    <div style="margin-bottom: 2rem;">
        <h3>
            <a id="home" href="$site.link()">&lt;&lt; Home</a>
        </h3>
        <h1 :text="$page.title"></h1>
        <div id="date-home">
            <p :text="$page.date.format('January 02, 2006')"></p>
        </div>
        <a id="home" href="$site.link()">Oliver Clarke</a>
        <div class="post" :html="$page.content()"></div>

        <!-- <footer>
            <hr>
            <h5>SITE UNDER CONSTRUCTION</h5>
            <img src="$site.asset('under-construction.gif').link()" width=90>
        </footer> -->

        <hr>
        <div id="prev-next">
            <div>Earlier</div>
            <a id="home" href="$site.link()">Home</a>
            <div>Later</div>
        </div>
        <div id="prev-next">
            <div :if="$page.prevPage?()">
                <a href="$if.link()">
                    ←
                    <span :text="$if.title"></span>
                </a>
            </div>

            <div :if="$page.nextPage?()">
                <a href="$if.link()">
                    <span :text="$if.title"></span>
                    →
                </a>
            </div>
        </div>
    </div>

</body>
